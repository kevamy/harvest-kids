# Local PostgreSQL for development and integration tests (pnpm db:up).
# Credentials below are for local use only.
name: harvest-kids-dev

services:
  db:
    image: postgres:16-alpine
    # Development and tests only, never production (docker-compose.yml): no write durability,
    # for disposable data. The integration suite spent minutes waiting on disk syncs.
    command:
      ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      POSTGRES_DB: postgres
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
